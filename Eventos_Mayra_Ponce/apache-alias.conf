# Dirección corta del sitio: http://localhost/eventos-mayra-ponce/
# Lo carga Apache desde C:/xampp/apache/conf/httpd.conf (línea "IncludeOptional ...apache-alias.conf").
# Si cambias este archivo, reinicia Apache desde el panel de XAMPP.
Alias /eventos-mayra-ponce "C:/xampp/htdocs/Eventos_Mayra_Ponce-1/Eventos_Mayra_Ponce"

<Directory "C:/xampp/htdocs/Eventos_Mayra_Ponce-1/Eventos_Mayra_Ponce">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
